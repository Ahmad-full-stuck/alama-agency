<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="وكالة علامة | Alama Agency — نصنع حملات تحجي الناس عنها، مو تحجي عليها. إعلانات ممولة، صناعة محتوى، رصد ترندات، وحملات إبداعية."
    />
    <title>وكالة علامة | Alama Agency — نصنع حملات تحجي عنها</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e31e24'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%D8%B9%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          var t = q.get("theme") || localStorage.getItem("alama-theme");
          if (t !== "light") document.documentElement.classList.add("dark");
          var l = q.get("lang") || localStorage.getItem("alama-lang");
          if (l === "en") {
            document.documentElement.setAttribute("dir", "ltr");
            document.documentElement.setAttribute("lang", "en");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
