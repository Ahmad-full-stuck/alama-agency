<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf8" />
    <meta
      name="description"
      content="وكالة علامة | Alama Agency — نصنع حملات تحجي الناس عنها، مو تحجي عليها. إعلانات ممولة، صناعة محتوى، رصد ترندات، وحملات إبداعية."
    />
    <title>وكالة علامة | Alama Agency — نصنع حملات تحجي عنها</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          var t = q.get("theme") || localStorage.getItem("alama-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
          var l = q.get("lang") || localStorage.getItem("alama-lang");
          if (l === "en") {
            document.documentElement.setAttribute("dir", "ltr");
            document.documentElement.setAttribute("lang", "en");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
